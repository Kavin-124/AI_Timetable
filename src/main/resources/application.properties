# Server
server.port=${PORT:8080}

# Application login credentials (set these in the deployment environment)
spring.security.user.name=${APP_ADMIN_USERNAME}
spring.security.user.password=${APP_ADMIN_PASSWORD}

# MySQL connection (set these in the deployment environment)
spring.datasource.url=${APP_DB_URL}
spring.datasource.username=${APP_DB_USERNAME}
spring.datasource.password=${APP_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Connection pool
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
